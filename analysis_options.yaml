# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.

# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs. The analyzer can also be invoked from the command line by running
# `flutter analyze`.

# Recommended Flutter lints
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # Avoid using print() in production code
    avoid_print: true

    # Prefer const constructors when possible
    prefer_const_constructors: true

    # Prefer const collections when possible
    prefer_const_literals_to_create_immutables: true

    # Don't use Container when it is not necessary
    avoid_unnecessary_containers: true

    # Always explicitly declare the return type of functions
    always_declare_return_types: true

    # Prefer single quotes instead of double quotes
    prefer_single_quotes: true

    # Keep import/directive statements properly ordered
    directives_ordering: true

    # Prefer relative imports within the project
    prefer_relative_imports: true